<!DOCTYPE html>
<html>
<head>
  <title>Daily Discipline Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #141E30, #243B55);
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 { margin-bottom: 5px; }

    .date {
      font-size: 14px;
      margin-bottom: 15px;
      opacity: 0.8;
    }

    .container {
      background: white;
      color: black;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    input {
      width: 60%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #243B55;
      color: white;
      cursor: pointer;
      margin-left: 5px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      background: #f1f1f1;
      margin: 8px 0;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .completed {
      text-decoration: line-through;
      color: gray;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .delete-btn {
      background: red;
      padding: 5px 8px;
      border-radius: 6px;
    }

    #historyBox {
      margin-top: 20px;
      text-align: left;
      display: none;
      max-height: 300px;
      overflow-y: auto;
    }

    .history-day {
      background: #eee;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<h1>🔥 Daily Discipline</h1>
<div class="date" id="todayDate"></div>

<div class="container">
  <input type="text" id="taskInput" placeholder="Enter daily task">
  <button onclick="addTask()">Add</button>
  <button onclick="toggleHistory()">History</button>

  <ul id="taskList"></ul>

  <div id="historyBox"></div>
</div>

<script>
const today = new Date().toDateString();
document.getElementById("todayDate").innerText = "Date: " + today;

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let savedDate = localStorage.getItem("savedDate");

// 🔄 DAILY RESET + HISTORY SAVE
if (savedDate !== today) {
  if (savedDate) {
    let history = JSON.parse(localStorage.getItem("history")) || [];
    history.push({ date: savedDate, tasks: tasks });
    localStorage.setItem("history", JSON.stringify(history));
  }

  tasks = tasks.map(task => ({
    text: task.text,
    completed: false
  }));

  localStorage.setItem("savedDate", today);
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

// ➕ ADD TASK
function addTask() {
  const input = document.getElementById("taskInput");
  if (input.value.trim() === "") return;

  tasks.push({ text: input.value, completed: false });
  input.value = "";
  saveAndRender();
}

// ✔ TOGGLE TASK
function toggleTask(index) {
  tasks[index].completed = !tasks[index].completed;
  saveAndRender();
}

// ❌ DELETE TASK
function deleteTask(index) {
  tasks.splice(index, 1);
  saveAndRender();
}

// 💾 SAVE + RENDER
function saveAndRender() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
  renderTasks();
}

// 🖥 RENDER TASKS
function renderTasks() {
  const list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach((task, index) => {
    const li = document.createElement("li");

    const left = document.createElement("div");
    left.className = "task-left";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.completed;

    checkbox.onclick = (e) => {
      e.stopPropagation();
      toggleTask(index);
    };

    const span = document.createElement("span");
    span.textContent = task.text;
    if (task.completed) span.classList.add("completed");

    left.appendChild(checkbox);
    left.appendChild(span);

    const del = document.createElement("button");
    del.textContent = "❌";
    del.className = "delete-btn";
    del.onclick = () => deleteTask(index);

    li.appendChild(left);
    li.appendChild(del);

    list.appendChild(li);
  });
}

// 📊 HISTORY TOGGLE
function toggleHistory() {
  const box = document.getElementById("historyBox");

  if (box.style.display === "none") {
    showHistory();
    box.style.display = "block";
  } else {
    box.style.display = "none";
  }
}

// 📜 SHOW HISTORY
function showHistory() {
  const history = JSON.parse(localStorage.getItem("history")) || [];
  const box = document.getElementById("historyBox");

  box.innerHTML = "";

  history.slice().reverse().forEach(day => {
    const div = document.createElement("div");
    div.className = "history-day";

    let html = "<b>" + day.date + "</b><br>";

    day.tasks.forEach(task => {
      html += (task.completed ? "✅ " : "❌ ") + task.text + "<br>";
    });

    div.innerHTML = html;
    box.appendChild(div);
  });
}

// INITIAL LOAD
renderTasks();
</script>

</body>
</html>
